<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nirala English Wala - Attendance</title>
<link rel="icon" id="fav" href="data:,">
<style>
  :root{--navy:#0b3f67;--navy2:#0a3358;--blue:#1f6fb2;--gold:#d9a520;--bg:#eaf1f8;--card:#fff;--ink:#14263a;--mute:#5d7088;--ok:#12a150;--bad:#d93a3a;--line:#d6e1ee;--soft:#e3edf8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  [hidden]{display:none!important}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:44px;height:44px;border-radius:12px;background:#fff}
  .brand b{display:block;font-size:16px;line-height:1.1}
  .brand span{font-size:12px;opacity:.85}
  main{max-width:900px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(11,63,103,.06)}
  input,select,textarea,button{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--line)}
  input,select,textarea{background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0}
  textarea{width:100%;min-height:90px}
  button{background:var(--navy);color:#fff;border:0;cursor:pointer}
  button:hover{background:var(--blue)}
  button.sec{background:var(--soft);color:var(--navy)}
  button.sec:hover{background:#d3e3f4}
  button.bad{background:var(--bad)}
  button.ok{background:var(--ok)}
  button.gold{background:var(--gold);color:#2a1d00;font-weight:700}
  button.sm{padding:5px 9px;font-size:13px}
  header button.sec{background:rgba(255,255,255,.16);color:#fff}
  header select{max-width:150px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:var(--soft);color:var(--navy)}
  .tabs button.on{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--mute);font-weight:600}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft)}
  .tag.p{background:#dcf5e7;color:#0b6b35}.tag.a{background:#fde3e3;color:#9b1f1f}
  .mute{color:var(--mute);font-size:13px}
  #qrWrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  #qr{background:#fff;padding:12px;border-radius:12px;border:3px solid var(--navy)}
  #qrInfo{font-weight:600;text-align:center;color:var(--navy)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .stat{background:var(--soft);color:var(--navy);border-left:4px solid var(--gold);border-radius:10px;padding:8px 14px;font-weight:700}
  .durBox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .durBox label{display:block;margin-bottom:6px;font-weight:600;color:var(--navy);font-size:14px}
  .durBox input{width:84px;text-align:center;font-weight:700;font-size:18px}
  .durBox .chip{min-width:44px}
  .login{max-width:360px;margin:40px auto;padding:0 14px;text-align:center}
  .login img{width:112px;height:112px;border-radius:22px;background:#fff;box-shadow:0 6px 18px rgba(11,63,103,.25);margin-bottom:10px}
  .login h1{margin:0 0 14px;font-size:20px;color:var(--navy)}
  .login .card{text-align:left}
  .login input{width:100%;margin-bottom:10px}
  .err{color:var(--bad);font-size:14px;min-height:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{background:var(--soft);color:var(--navy)}
  .seg button.on{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
  .camBox{position:relative;margin:10px auto 0;max-width:520px;border-radius:12px;overflow:hidden;background:#000;border:3px solid var(--navy)}
  .camBox video{display:block;width:100%;height:auto}
  .camBox canvas{position:absolute;left:0;top:0;width:100%;height:100%}
  #faceLog div{padding:2px 0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .capWrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0;text-align:center}
  .capWrap #fHint{font-size:16px;font-weight:600;color:var(--navy);min-height:20px}
  button.bigCap{font-size:22px;padding:18px 44px;min-width:min(100%,300px);border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .row.mid{justify-content:center}
  .chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;cursor:pointer}
  .chk input{width:18px;height:18px;padding:0}
  .flagBtn.on{background:#fde3e3;color:#9b1f1f;box-shadow:inset 0 0 0 1px #e9a3a3}
  .flagTxt{font-size:12px;color:#9b1f1f;margin-top:2px}
  .modal{position:fixed;inset:0;background:rgba(10,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:14px;border-top:5px solid var(--gold);padding:16px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .mbox select,.mbox textarea{width:100%;margin-top:4px}
  .mbox textarea{min-height:70px}
  .monWrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
  table.mon{min-width:100%;width:max-content}
  table.mon th,table.mon td{padding:6px 7px;white-space:nowrap;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid #eef3f9}
  table.mon th:nth-child(2),table.mon td:nth-child(2){text-align:left;position:sticky;left:0;background:#fff;z-index:1;box-shadow:2px 0 0 var(--line)}
  table.mon thead th{background:#f3f7fb}
  table.mon td.c{cursor:pointer;font-weight:700}
  table.mon td.mp{color:#0b6b35;background:#f1fbf5}
  table.mon td.ma{color:#9b1f1f;background:#fff5f5}
  table.mon td.low{color:#9b1f1f;font-weight:700}
  table.mon tfoot td{font-weight:700;background:#f3f7fb}
  #printArea{display:none}
  @media print{
    body>*:not(#printArea){display:none!important}
    body{background:#fff!important;padding:0!important;margin:0!important}
    #printArea{display:block!important;color:#000;font-size:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #printArea .ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0b3f67;padding-bottom:8px;margin-bottom:10px}
    #printArea .ph img{width:56px;height:56px;border-radius:8px}
    #printArea .pn{font-size:18px;font-weight:700;color:#0b3f67}
    #printArea .pt{font-size:14px;font-weight:600}
    #printArea .ps{font-size:12px;color:#333}
    #printArea .sum{margin:6px 0 8px;font-weight:600}
    #printArea table{border-collapse:collapse;width:100%}
    #printArea th,#printArea td{border:1px solid #444;padding:4px 6px;font-size:11.5px;text-align:left;color:#000}
    #printArea th{background:#e8eef5}
    #printArea thead{display:table-header-group}
    #printArea tr{break-inside:avoid}
    #printArea .c{text-align:center}
    #printArea .pp{color:#0b6b35;font-weight:700}
    #printArea .pa{color:#9b1f1f;font-weight:700}
    #printArea .low{color:#9b1f1f;font-weight:700}
    #printArea .foot{margin-top:18px;display:flex;justify-content:space-between;font-size:11px;color:#333}
    #printArea h4{margin:14px 0 4px;font-size:13px}
    #printArea .fl{font-size:11.5px;margin:2px 0}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login">
  <img data-logo  alt="Nirala English Wala &amp; Arts">
  <h1>Nirala English Wala &amp; Arts</h1>
  <div class="card">
    <h2 style="margin-top:0" data-i="loginTitle"></h2>
    <input id="email" type="email" data-ph="email" autocomplete="username">
    <input id="pass" type="password" data-ph="pass" autocomplete="current-password">
    <button id="loginBtn" style="width:100%" data-i="login"></button>
    <p class="err" id="loginErr"></p>
  </div>
</section>

<!-- APP -->
<div id="app" hidden>
  <header>
    <div class="brand">
      <img data-logo  alt="">
      <div><b>Nirala English Wala &amp; Arts</b><span data-i="appTitle"></span></div>
    </div>
    <div class="row">
      <select id="classSel"></select>
      <button class="sec sm" id="addClassBtn" data-i="addClass"></button>
      <button class="sec sm" id="logoutBtn" data-i="logout"></button>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button data-tab="att" class="on" data-i="tabAtt"></button>
      <button data-tab="stu" data-i="tabStu"></button>
      <button data-tab="rep" data-i="tabRep"></button>
      <button data-tab="mon" data-i="tabMon"></button>
      <button data-tab="face" data-i="tabFace"></button>
    </div>

    <!-- ATTENDANCE TAB -->
    <section id="tab-att">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div>
            <strong id="attTitle"></strong>
            <div class="mute" data-i="qrHint"></div>
          </div>
          <div class="row">
            <button id="startBtn" class="gold" data-i="start"></button>
            <button id="endBtn" class="bad" hidden data-i="stop"></button>
          </div>
        </div>
        <div id="durBox" class="durBox">
          <label for="dur" data-i="durLabel"></label>
          <div class="row">
            <button class="sec sm" id="durMinus" type="button">-5</button>
            <input id="dur" type="number" inputmode="numeric" min="1" max="180" step="1" value="10">
            <button class="sec sm" id="durPlus" type="button">+5</button>
            <span class="row" style="gap:6px">
              <button class="sec sm chip" type="button" data-min="10">10</button>
              <button class="sec sm chip" type="button" data-min="20">20</button>
              <button class="sec sm chip" type="button" data-min="30">30</button>
              <button class="sec sm chip" type="button" data-min="45">45</button>
              <button class="sec sm chip" type="button" data-min="60">60</button>
            </span>
          </div>
          <div class="mute" id="durHint" style="margin-top:6px"></div>
        </div>
        <div id="qrWrap" hidden>
          <div id="qr"></div>
          <div id="qrInfo"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat" id="statP"></div>
        <div class="stat" id="statA"></div>
        <div class="stat" id="statT"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <strong data-i="presentH"></strong>
          <table><tbody id="presentList"></tbody></table>
        </div>
        <div class="card">
          <strong data-i="absentH"></strong> <span class="mute" data-i="absentHint"></span>
          <table><tbody id="absentList"></tbody></table>
        </div>
      </div>
    </section>

    <!-- STUDENTS TAB -->
    <section id="tab-stu" hidden>
      <div class="card">
        <strong data-i="addStu"></strong>
        <div class="row" style="margin-top:8px">
          <input id="sRoll" data-ph="rollPh" style="width:110px">
          <input id="sName" data-ph="namePh" style="flex:1;min-width:160px">
          <button id="sAddBtn" data-i="add"></button>
        </div>
        <p class="mute" style="margin-bottom:4px" data-i="bulkHint"></p>
        <textarea id="bulk" data-ph="bulkPh"></textarea>
        <div class="row" style="margin-top:8px"><button id="bulkBtn" class="sec" data-i="bulkBtn"></button></div>
      </div>
      <div class="card">
        <strong id="stuCount"></strong>
        <table><tbody id="stuList"></tbody></table>
      </div>
    </section>

    <!-- REPORT TAB -->
    <section id="tab-rep" hidden>
      <div class="card">
        <div class="row">
          <input type="date" id="repDate">
          <button id="repBtn" data-i="show"></button>
          <button id="csvBtn" class="sec" data-i="csv"></button>
          <button id="pdfBtn" class="gold" data-i="pdf"></button>
        </div>
        <div class="stats" id="repStats"></div>
        <table>
          <thead><tr><th data-i="thRoll"></th><th data-i="thName"></th><th data-i="thStatus"></th><th data-i="thTime"></th><th data-i="thMethod"></th><th data-i="thFlag"></th></tr></thead>
          <tbody id="repList"></tbody>
        </table>
      </div>
    </section>

    <!-- FACE TAB -->
    <section id="tab-mon" hidden>
      <div class="card">
        <div class="row">
          <input type="month" id="monMonth">
          <button id="monBtn" data-i="show"></button>
          <button id="monPdf" class="gold" data-i="pdf"></button>
          <button id="monCsv" class="sec" data-i="csv"></button>
        </div>
        <div class="mute" style="margin-top:6px" data-i="monHint"></div>
        <div class="stats" id="monStats"></div>
        <div id="monWrap" class="monWrap" hidden></div>
        <div id="monFlags"></div>
      </div>
    </section>

    <section id="tab-face" hidden>
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="seg">
            <button id="modeScan" class="on" type="button" data-i="modeScan"></button>
            <button id="modeEnroll" type="button" data-i="modeEnroll"></button>
          </div>
          <div class="row">
            <button id="camStart" class="gold" type="button" data-i="camStart"></button>
            <button id="camStop" class="bad" type="button" hidden data-i="camStop"></button>
            <button id="camFlip" class="sec sm" type="button" data-i="camFlip"></button>
          </div>
        </div>
        <div id="faceMsg" class="mute" style="margin-top:8px;min-height:18px"></div>
        <div id="camBox" class="camBox" hidden>
          <video id="cam" playsinline muted autoplay></video>
          <canvas id="camOv"></canvas>
        </div>

        <div id="scanPanel" style="margin-top:10px">
          <div class="row">
            <label class="mute" for="faceStrict" data-i="strictLabel"></label>
            <select id="faceStrict">
              <option value="strict" data-i="strict"></option>
              <option value="normal" data-i="normal" selected></option>
              <option value="relaxed" data-i="relaxed"></option>
            </select>
          </div>
          <div style="margin-top:8px"><strong data-i="recentH"></strong></div>
          <div id="faceLog" class="mute"></div>
        </div>

        <div id="enrollPanel" style="margin-top:10px" hidden>
          <select id="fStu" style="width:100%"></select>
          <label class="chk"><input type="checkbox" id="autoMode" checked><span data-i="autoMode"></span></label>
          <div class="mute" id="autoHint" style="margin-top:4px" data-i="autoHint"></div>
          <div class="capWrap">
            <button id="fCap" class="gold bigCap" type="button" data-i="capture"></button>
            <div id="fHint"></div>
            <div id="fCount" class="mute"></div>
          </div>
          <div class="row mid">
            <button id="fSave" type="button" data-i="saveFace"></button>
            <button id="fClear" class="sec" type="button" data-i="clearSamples"></button>
            <button id="fDel" class="bad sm" type="button" hidden data-i="delFace"></button>
          </div>
          <p class="mute" data-i="consentNote"></p>
        </div>
      </div>

      <div class="card">
        <strong id="faceCount"></strong>
        <table><tbody id="faceList"></tbody></table>
      </div>
    </section>
  </main>
</div>

const durInput = $("#dur");
function readMinutes() {
  const v = Math.round(Number(durInput.value));
  return Number.isFinite(v) && v >= MIN_MIN && v <= MAX_MIN ? v : 0;
}
function saveMinutes(m) { try { localStorage.setItem("attMinutes", String(m)); } catch (e) {} }
function updateDurHint() {
  const m = readMinutes();
  $("#durHint").textContent = m ? t("durHint", m, Math.ceil(m * 60 * 1000 / STEP)) : t("badDuration");
}
function setMinutes(v) {
  durInput.value = Math.max(MIN_MIN, Math.min(MAX_MIN, Math.round(v)));
  saveMinutes(durInput.value);
  updateDurHint();
}
durInput.addEventListener("input", () => { const m = readMinutes(); if (m) saveMinutes(m); updateDurHint(); });

/* ---------- QR SESSION ---------- */
async function loadSession() {
  session = null;
  const cid = classId;
  try {
    const snap = await getDoc(doc(db, "sessions", `${today()}_${cid}`));
    if (cid !== classId || session) return;              // class changed meanwhile, or a session already started
    const d = snap.exists() ? snap.data() : null;
    const dur = d && d.durationMs ? d.durationMs : WINDOW;
    if (d && !d.ended && Date.now() < d.startMs + dur) {   // never resume a session that was stopped
      session = { sid: snap.id, startMs: d.startMs, durationMs: dur, tokens: d.tokens };
      runTicker();
    }
  } catch (e) { console.error(e); }
}

$("#startBtn").onclick = async () => {
  if (!classId) return alert(t("pickClass"));
  if (!students.length) return alert(t("addStudentsFirst"));
  const mins = readMinutes();
  if (!mins) return alert(t("badDuration"));
  const d = today(), sid = `${d}_${classId}`;
  const ref = doc(db, "sessions", sid);
  const old = await getDoc(ref);
  const running = old.exists() && !old.data().ended && Date.now() < old.data().startMs + (old.data().durationMs || WINDOW);
  if (running && !confirm(t("confirmRunning"))) return;

  const startMs = Date.now();
  const durationMs = mins * 60 * 1000;
  const tokens = Array.from({ length: Math.ceil(durationMs / STEP) }, randToken);   // 4 QR per 10 min
  const b = writeBatch(db);
  if (old.exists()) (old.data().tokens || []).forEach(x => b.delete(doc(db, "sessions", sid, "tokens", x)));
  b.set(ref, { sid, classId, date: d, startMs, durationMs, tokens, ended: false });
  tokens.forEach((x, i) => b.set(doc(db, "sessions", sid, "tokens", x), {
    validFrom: Timestamp.fromMillis(startMs + i * STEP - GRACE),
    validUntil: Timestamp.fromMillis(startMs + Math.min((i + 1) * STEP, durationMs) + GRACE)
  }));
  await b.commit();
  session = { sid, startMs, durationMs, tokens };
  runTicker();
};

$("#endBtn").onclick = async () => {
  if (!session || !confirm(t("confirmEnd"))) return;
  const { sid, tokens } = session;
  const b = writeBatch(db);
  tokens.forEach(x => b.delete(doc(db, "sessions", sid, "tokens", x)));
  b.set(doc(db, "sessions", sid), { ended: true, endedMs: Date.now() }, { merge: true });   // remember it was stopped
  try { await b.commit(); stopTicker(); }
  catch (e) { console.error(e); alert(t("netErr")); }
};

function runTicker() {
  clearInterval(tickTimer);
  shownIdx = -1;
  $("#qrWrap").hidden = false; $("#startBtn").hidden = true; $("#endBtn").hidden = false; $("#durBox").hidden = true;
  tick();
  tickTimer = setInterval(tick, 500);
}

function stopTicker() {
  clearInterval(tickTimer); tickTimer = null; session = null; shownIdx = -1;
  $("#qrWrap").hidden = true; $("#startBtn").hidden = false; $("#endBtn").hidden = true; $("#durBox").hidden = false;
  $("#qr").innerHTML = "";
}

function tick() {
  if (!session) return;
  const el = Date.now() - session.startMs;
  if (el >= session.durationMs) { stopTicker(); return; }
  const total = session.tokens.length;
  const idx = Math.min(total - 1, Math.floor(el / STEP));
  if (idx !== shownIdx) { shownIdx = idx; drawQR(session.tokens[idx]); }
  $("#qrInfo").innerHTML = `${t("qrOf", idx + 1, total, idx < total - 1 ? mmss(STEP - (el % STEP)) : "-")}<br>
    <span class="mute">${t("qrLeft", mmss(session.durationMs - el))}</span>`;
}

function drawQR(token) {
  const url = new URL("student4.html", location.href);
  url.search = "";
  url.searchParams.set("s", session.sid);
  url.searchParams.set("t", token);
  const box = $("#qr"); box.innerHTML = "";
  const size = Math.min(300, window.innerWidth - 80);
  new QRCode(box, { text: url.toString(), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
}

/* ---------- FACE ATTENDANCE ---------- */
const FACE_LIB    = "https://cdn.jsdelivr.net/gh/vladmandic/face-api@1.7.12/dist/face-api.js";
const FACE_MODELS = "https://cdn.jsdelivr.net/gh/vladmandic/face-api@1.7.12/model";
const STRICT = { strict: 0.40, normal: 0.45, relaxed: 0.52 };   // largest face distance still counted as the same person
const FACE_FRAMES = 2;          // a not-so-certain match must repeat this many times (a very close match counts at once)
const MIN_SAMPLES = 3, MAX_SAMPLES = 8, AUTO_SAMPLES = 5;
const AUTO_GAP = 900;           // ms between automatic photos
const DETECT_SIZE = 224;        // small input = fast (face should be reasonably close to the camera)
const TRACK_TTL = 700;          // ms a face may disappear before its track is dropped
const REVERIFY = 2000, REVERIFY_DONE = 6000, UNKNOWN_RETRY = 500;
const MARK_COOLDOWN = 15000;

/* FACE-PURE:BEGIN */
const FACE_MARGIN = 0.05;               // the best match must beat the 2nd best person by this much
function descsFrom(flat) {
  const out = [];
  for (let i = 0; i + 128 <= flat.length; i += 128) out.push(Float32Array.from(flat.slice(i, i + 128)));
  return out;
}
function faceDist(a, b) {
  let s = 0;
  for (let i = 0; i < 128; i++) { const d = a[i] - b[i]; s += d * d; }
  return Math.sqrt(s);
}
function bestMatch(desc, gal, limit) {
  let best = null, second = Infinity;
  for (const g of gal) {
    let d = Infinity;
    for (const x of g.descs) d = Math.min(d, faceDist(desc, x));
    if (!best || d < best.d) { if (best) second = best.d; best = { g, d }; }
    else if (d < second) second = d;
  }
  if (!best) return null;
  return { roll: best.g.roll, name: best.g.name, d: best.d, ok: best.d <= limit && (second - best.d) >= FACE_MARGIN };
}
function iou(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.width, b.x + b.width), y2 = Math.min(a.y + a.height, b.y + b.height);
  const i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const u = a.width * a.height + b.width * b.height - i;
  return u > 0 ? i / u : 0;
}
function matchBoxes(as, bs, min) {            // greedy best-overlap pairing -> [[indexInAs, indexInBs], ...]
  const c = [];
  as.forEach((a, i) => bs.forEach((b, j) => { const v = iou(a, b); if (v >= (min ?? 0.25)) c.push([v, i, j]); }));
  c.sort((p, q) => q[0] - p[0]);
  const ua = new Set(), ub = new Set(), out = [];
  for (const [, i, j] of c) if (!ua.has(i) && !ub.has(j)) { ua.add(i); ub.add(j); out.push([i, j]); }
  return out;
}
const isConfident = (d, limit) => d <= Math.min(limit - 0.08, 0.36);
function nextToEnroll(rolls, enrolled, current) {   // next student after `current` who has no face yet ("" if none)
  const i = rolls.indexOf(current);
  for (let k = 1; k <= rolls.length; k++) {
    const r = rolls[(i + k + rolls.length) % rolls.length];
    if (r !== current && !enrolled.has(r)) return r;
  }
  return "";
}
/* FACE-PURE:END */

let faceDocs = new Map();               // roll -> { count, flat }   (numbers only, no photos)
let gallery = [];                       // [{ roll, name, descs: [Float32Array(128)] }]
let faceReady = null, starting = false;
let stream = null, wake = null, camFacing = "user", camMode = "scan";
let loopGen = 0, wantCap = false, forceFull = false;
let tracks = [];                        // faces currently in front of the camera
const markedAt = new Map();             // roll -> time of last attendance write
let pending = [];                       // photos taken for the student being enrolled
let lastSample = 0, saving = false, needLeave = false, autoPicked = false;
let faceLog = [];
const marking = new Set();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function rebuildGallery() {
  gallery = students.filter(s => faceDocs.has(s.roll))
    .map(s => ({ roll: s.roll, name: s.name, descs: descsFrom(faceDocs.get(s.roll).flat || []) }));
}
function setFaceMsg(m) { $("#faceMsg").textContent = m || ""; }
function faceErr(e) { setFaceMsg(e && e.code === "permission-denied" ? t("rulesErr") : t("netErr")); }
function announce() {
  setFaceMsg(camMode === "scan" ? (gallery.length ? t("scanning", gallery.length) : t("noFaces")) : "");
}

function loadScript(src) {
  return new Promise((ok, no) => {
    const el = document.createElement("script");
    el.src = src; el.onload = ok; el.onerror = () => no(new Error("script"));
    document.head.appendChild(el);
  });
}
const detOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: DETECT_SIZE, scoreThreshold: 0.5 });
function loadFace() {
  if (faceReady) return faceReady;
  faceReady = (async () => {
    setFaceMsg(t("faceLoading"));
    if (!window.faceapi) await loadScript(FACE_LIB);
    const gl = await faceapi.tf.setBackend("webgl").catch(() => false);
    if (!gl) await faceapi.tf.setBackend("cpu");
    await faceapi.tf.ready();
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(FACE_MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
    ]);
    // warm-up: run every network once so the first real face is not slow (shader compile / memory allocation)
    try {
      const c = document.createElement("canvas"); c.width = c.height = 160;
      const x = c.getContext("2d"); x.fillStyle = "#777"; x.fillRect(0, 0, 160, 160);
      await faceapi.detectAllFaces(c, detOpts());
      await faceapi.nets.faceLandmark68TinyNet.detectLandmarks(c);
      await faceapi.nets.faceRecognitionNet.computeFaceDescriptor(c);
    } catch (e) { console.warn("warm-up skipped", e); }
  })().catch(e => { faceReady = null; throw e; });
  return faceReady;
}

/* ----- camera ----- */
async function startCam(manual) {
  if (stream || starting) return;
  if (!classId) return manual === true ? alert(t("pickClass")) : setFaceMsg(t("pickClass2"));
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return setFaceMsg(t("camDenied"));
  starting = true;
  try {
    try { await loadFace(); } catch (e) { console.error(e); return setFaceMsg(t("faceLoadErr")); }
    let st;
    try {
      st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch (e) { console.error(e); return setFaceMsg(t("camDenied")); }
    if ($("#tab-face").hidden) { st.getTracks().forEach(x => x.stop()); return; }   // user left the tab while loading
    stream = st;
    const v = $("#cam");
    v.srcObject = st;
    try { await v.play(); } catch (e) {}
    try { wake = navigator.wakeLock ? await navigator.wakeLock.request("screen") : null; } catch (e) { wake = null; }
    $("#camBox").hidden = false; $("#camStart").hidden = true; $("#camStop").hidden = false;
    announce();
    if (camMode === "enroll") enterEnroll(true);
    runLoop();
  } finally { starting = false; }
}
function stopCam() {
  loopGen++; wantCap = false; tracks = []; forceFull = false; autoPicked = false;
  if (stream) { stream.getTracks().forEach(x => x.stop()); stream = null; }
  if (wake) { wake.release().catch(() => {}); wake = null; }
  const v = $("#cam"); v.srcObject = null;
  const c = $("#camOv"); c.getContext("2d").clearRect(0, 0, c.width, c.height);
  $("#camBox").hidden = true; $("#camStart").hidden = false; $("#camStop").hidden = true;
}
$("#camStart").onclick = () => startCam(true);
$("#camStop").onclick = () => { stopCam(); announce(); };
$("#camFlip").onclick = async () => {
  camFacing = camFacing === "user" ? "environment" : "user";
  if (stream) { stopCam(); await startCam(); }
};

function enterEnroll(reset) {
  if (reset) needLeave = false;
  const sel = $("#fStu");
  if (!sel.value && !autoPicked) {
    const nxt = nextToEnroll(students.map(x => x.roll), new Set(faceDocs.keys()), "");
    if (nxt) { sel.value = nxt; autoPicked = true; pending = []; }
  }
  updateEnrollUI();
}
function setMode(m) {
  camMode = m; tracks = []; wantCap = false; autoPicked = false;
  $("#modeScan").classList.toggle("on", m === "scan");
  $("#modeEnroll").classList.toggle("on", m === "enroll");
  $("#scanPanel").hidden = m !== "scan";
  $("#enrollPanel").hidden = m !== "enroll";
  if (m === "enroll") enterEnroll(true);
  draw([]);
  announce();
}
$("#modeScan").onclick = () => setMode("scan");

/* ----- detection loop (runs back-to-back, one pass per camera frame) ----- */
const nextFrame = () => (faceapi.tf && faceapi.tf.nextFrame) ? faceapi.tf.nextFrame() : sleep(16);
async function runLoop() {
  const gen = ++loopGen;
  while (stream && gen === loopGen) {
    try { await (camMode === "scan" ? scanOnce() : enrollOnce()); }
    catch (e) { console.error(e); await sleep(300); }
    await nextFrame();
  }
}
// fast: face boxes only (no landmarks / no faceprint)
async function detectBoxes() {
  const v = $("#cam");
  if (!v.videoWidth) return [];
  return (await faceapi.detectAllFaces(v, detOpts())).map(d => ({ box: d.box, score: d.score }));
}
// full: boxes + faceprints
async function detectFull() {
  const v = $("#cam");
  if (!v.videoWidth) return [];
  const res = await faceapi.detectAllFaces(v, detOpts()).withFaceLandmarks(true).withFaceDescriptors();
  return res.map(r => ({ box: r.detection.box, score: r.detection.score, descriptor: r.descriptor }));
}
function draw(items) {
  const v = $("#cam"), c = $("#camOv");
  if (!v.videoWidth) return;
  if (c.width !== v.videoWidth || c.height !== v.videoHeight) { c.width = v.videoWidth; c.height = v.videoHeight; }
  const x = c.getContext("2d");
  x.clearRect(0, 0, c.width, c.height);
  x.lineWidth = Math.max(3, c.width / 200);
  const fs = Math.max(16, Math.round(c.width / 28));
  x.font = `${fs}px system-ui, sans-serif`;
  for (const it of items) {
    x.strokeStyle = it.color; x.strokeRect(it.box.x, it.box.y, it.box.width, it.box.height);
    if (it.label) {
      const w = x.measureText(it.label).width + 12, h = fs + 10, y = Math.max(0, it.box.y - h);
      x.fillStyle = it.color; x.fillRect(it.box.x, y, w, h);
      x.fillStyle = "#fff"; x.fillText(it.label, it.box.x + 6, y + fs);
    }
  }
}
const presentRolls = () => new Set(att.map(a => a.roll));

/* ----- scanning ----- */
function verifyTrack(tr, desc, now, limit, done) {
  const m = gallery.length ? bestMatch(desc, gallery, limit) : null;
  if (m && m.ok) {
    tr.hits = tr.roll === m.roll ? tr.hits + 1 : 1;
    tr.roll = m.roll; tr.name = m.name; tr.miss = 0; tr.unsure = false;
    tr.confirmed = isConfident(m.d, limit) || tr.hits >= FACE_FRAMES;
    tr.next = tr.confirmed ? now + (done.has(m.roll) ? REVERIFY_DONE : REVERIFY) : now;
  } else {
    tr.miss++; tr.unsure = !!m;
    if (tr.miss >= 3 || !tr.confirmed) { tr.roll = null; tr.hits = 0; tr.confirmed = false; }
    tr.next = now + UNKNOWN_RETRY;
  }
}
async function scanOnce() {
  if (!$("#cam").videoWidth) return;
  const now = performance.now();
  const limit = STRICT[$("#faceStrict").value] ?? STRICT.normal;
  const done = presentRolls();
  const due = tr => now >= tr.next;
  const full = !tracks.length || forceFull || tracks.some(due);   // faceprints only when somebody needs checking
  forceFull = false;
  const found = full ? await detectFull() : await detectBoxes();
  const used = new Set();
  for (const [i, j] of matchBoxes(found.map(f => f.box), tracks.map(x => x.box))) {
    used.add(i);
    const tr = tracks[j];
    tr.box = found[i].box; tr.seenAt = now;
    if (full && found[i].descriptor && due(tr)) verifyTrack(tr, found[i].descriptor, now, limit, done);
  }
  found.forEach((f, i) => {
    if (used.has(i)) return;
    const tr = { box: f.box, roll: null, name: "", hits: 0, miss: 0, confirmed: false, unsure: false, next: 0, seenAt: now };
    tracks.push(tr);
    if (full && f.descriptor) verifyTrack(tr, f.descriptor, now, limit, done); else forceFull = true;
  });
  tracks = tracks.filter(x => now - x.seenAt <= TRACK_TTL);
  const items = [];
  for (const tr of tracks) {
    if (tr.confirmed && tr.roll) {
      const already = done.has(tr.roll);
      items.push({ box: tr.box, label: tr.name + (already ? " ✓" : ""), color: "#12a150" });
      if (!already) markFace({ roll: tr.roll, name: tr.name });        // not awaited: the loop keeps running
    } else if (tr.roll) {
      items.push({ box: tr.box, label: t("verifying"), color: "#d9a520" });
    } else {
      items.push({ box: tr.box, label: tr.unsure ? t("notSure") : t("unknownFace"), color: tr.unsure ? "#d9a520" : "#d93a3a" });
    }
  }
  draw(items);
}
async function markFace(m) {
  if (marking.has(m.roll) || performance.now() - (markedAt.get(m.roll) || -1e9) < MARK_COOLDOWN) return;
  marking.add(m.roll); markedAt.set(m.roll, performance.now());
  const d = today();
  try {
    await setDoc(doc(db, "attendance", `${d}_${classId}_${m.roll}`), {
      sid: `${d}_${classId}`, classId, date: d, roll: m.roll, name: m.name,
      method: "face", token: "", ts: serverTimestamp()
    });
    logFace(`${m.name} (${m.roll})`);
  } catch (e) { console.error(e); faceErr(e); }
  finally { marking.delete(m.roll); }
}
function logFace(text) {
  faceLog.unshift(new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) + " · " + text);
  faceLog = faceLog.slice(0, 6);
  renderFaceLog();
}
function renderFaceLog() { $("#faceLog").innerHTML = faceLog.map(x => `<div>${esc(x)}</div>`).join("") || "<div>-</div>"; }

/* ----- enrollment ----- */
const goodFace = (f, v) => f.box.width >= v.videoWidth * 0.18 && f.score >= 0.6;
async function enrollOnce() {
  const v = $("#cam");
  if (!v.videoWidth) return;
  const now = performance.now();
  const roll = $("#fStu").value, auto = $("#autoMode").checked;
  const wantAuto = auto && roll && !saving && !needLeave && pending.length < AUTO_SAMPLES && now - lastSample >= AUTO_GAP;
  if (!wantAuto && !wantCap) {                       // cheap pass: just show the boxes
    const bs = await detectBoxes();
    if (needLeave && !bs.length) {                   // previous student walked away -> ready for the next one
      needLeave = false;
      const s = students.find(x => x.roll === roll);
      if (s && !faceDocs.has(roll)) setFaceMsg(t("nextReady", s.name));
    }
    draw(bs.map(f => ({ box: f.box, label: "", color: bs.length === 1 && goodFace(f, v) ? "#12a150" : "#d93a3a" })));
    return;
  }
  const res = await detectFull();
  draw(res.map(f => ({ box: f.box, label: "", color: res.length === 1 && goodFace(f, v) ? "#12a150" : "#d93a3a" })));
  const manual = wantCap; wantCap = false;
  await takeSample(res, !manual);
}
async function takeSample(res, auto) {
  const roll = $("#fStu").value;
  if (!roll) return setFaceMsg(t("pickStudent"));
  if (res.length !== 1) { if (!auto) setFaceMsg(res.length ? t("onlyOne") : t("noFace")); else if (res.length) setFaceMsg(t("onlyOne")); return; }
  const v = $("#cam"), r = res[0];
  if (!goodFace(r, v)) { if (!auto) setFaceMsg(t("comeCloser")); return; }
  if (pending.length >= MAX_SAMPLES) return setFaceMsg(t("maxSamples"));
  const desc = Float32Array.from(r.descriptor);
  const now = performance.now();
  if (auto && pending.length && now - lastSample < 2500 && Math.min(...pending.map(p => faceDist(p, desc))) < 0.05) return;   // wait for a slightly different pose
  const others = gallery.filter(g => g.roll !== roll);
  const m = others.length ? bestMatch(desc, others, 0.42) : null;
  if (auto && m && m.d <= 0.42) {                    // this face already belongs to another student
    pending = []; needLeave = true; lastSample = now; updateEnrollUI();
    return setFaceMsg(t("dupAuto", m.name));
  }
  pending.push(desc); lastSample = now;
  setFaceMsg(t("sampleOk"));
  updateEnrollUI();
  if (auto && pending.length >= AUTO_SAMPLES) await saveFace(true);
}
function updateEnrollUI() {
  const roll = $("#fStu").value;
  $("#fCount").textContent = t("samplesTaken", pending.length, $("#autoMode").checked ? AUTO_SAMPLES : MAX_SAMPLES);
  $("#fHint").textContent = roll ? t("poseHint" + (pending.length % 5)) : t("pickStudent");
  $("#fSave").disabled = !roll || pending.length < MIN_SAMPLES || saving;
  $("#fDel").hidden = !(roll && faceDocs.has(roll));
  $("#autoHint").hidden = !$("#autoMode").checked;
}
$("#fStu").onchange = () => { pending = []; needLeave = false; lastSample = 0; updateEnrollUI(); };
$("#fClear").onclick = () => { pending = []; lastSample = 0; updateEnrollUI(); };
$("#autoMode").onchange = e => { try { localStorage.setItem("faceAuto", e.target.checked ? "1" : "0"); } catch (x) {} updateEnrollUI(); };
try { if (localStorage.getItem("faceAuto") === "0") $("#autoMode").checked = false; } catch (e) {}
$("#fCap").onclick = () => {

$("#fSave").onclick = () => saveFace(false);
async function saveFace(auto) {
  if (saving) return;
  const roll = $("#fStu").value, s = students.find(x => x.roll === roll);
  if (!s) return setFaceMsg(t("pickStudent"));
  if (pending.length < MIN_SAMPLES) return setFaceMsg(t("needSamples", MIN_SAMPLES));
  const others = gallery.filter(g => g.roll !== roll);         // is this face already enrolled as someone else?
  for (const p of pending) {
    const m = others.length ? bestMatch(p, others, 0.42) : null;
    if (m && m.d <= (auto ? 0.42 : 0.40)) {
      if (auto) { pending = []; needLeave = true; updateEnrollUI(); return setFaceMsg(t("dupAuto", m.name)); }   // auto never saves a doubtful face
      if (!confirm(t("dupFace", m.name, m.roll))) return;
      break;
    }
  }
  const flat = [];
  pending.forEach(p => p.forEach(v => flat.push(Math.round(v * 1e4) / 1e4)));
  saving = true; updateEnrollUI();
  try {
    await setDoc(doc(db, "faces", `${classId}_${roll}`), { classId, roll, count: pending.length, flat, updatedMs: Date.now() });
    pending = []; lastSample = performance.now();
    if (auto) {                                                  // jump to the next student without a face
      const nxt = nextToEnroll(students.map(x => x.roll), new Set([...faceDocs.keys(), roll]), roll);
      if (nxt) {
        $("#fStu").value = nxt; needLeave = true;
        const ns = students.find(x => x.roll === nxt);
        setFaceMsg(t("savedNext", s.name, ns ? ns.name : nxt));
      } else { needLeave = true; setFaceMsg(t("allEnrolled")); }
    } else setFaceMsg(t("saved", s.name));
  } catch (e) { console.error(e); faceErr(e); }
  finally { saving = false; updateEnrollUI(); }
}

    const cells = d.days.map(x => {
      const p = d.present.get(x).has(s.roll), f = d.flags.has(x + "|" + s.roll);
      return print ? `<td class="c ${p ? "pp" : "pa"}">${p ? "P" : "A"}${f ? "<sup>F</sup>" : ""}</td>`
                   : `<td class="c ${p ? "mp" : "ma"}" data-fd="${x}" data-fr="${esc(s.roll)}">${p ? "P" : "A"}${f ? "🚩" : ""}</td>`;
    }).join("");
    const low = st.n && st.pct[i] < 75;
    const fc = d.days.filter(x => d.flags.has(x + "|" + s.roll)).length;
    return `<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td>${cells}<td class="c">${st.per[i]}/${st.n}</td><td class="c ${low ? "low" : ""}">${st.n ? st.pct[i] + "%" : "-"}</td><td class="c">${fc || ""}</td></tr>`;
  }).join("");
  const foot = d.days.map(x => `<td class="c">${d.present.get(x).size}</td>`).join("");
  return `<table class="mon"><thead><tr><th>${t("thRoll")}</th><th style="text-align:left">${t("thName")}</th>${head}<th class="c">${t("thPresent")}</th><th class="c">${t("thPct")}</th><th class="c">${t("thFlags")}</th></tr></thead>
    <tbody>${body}</tbody><tfoot><tr><td></td><td style="text-align:left">${t("thPresent")}</td>${foot}<td></td><td></td><td></td></tr></tfoot></table>`;
}
function monFlagList() {
  const list = [...monData.flags.values()].filter(f => students.some(s => s.roll === f.roll)).sort((a, b) => a.date.localeCompare(b.date) || a.roll.localeCompare(b.roll, undefined, { numeric: true }));
  return list;
}
function renderMonth() {
  if (!monData) return;
  const st = monStats(), fl = monFlagList();
  $("#monStats").innerHTML = `<div class="stat">${t("monStatDays", st.n)}</div><div class="stat">${t("monStatAvg", st.avg)}</div><div class="stat">${t("monStatFlags", fl.length)}</div>`;
  if (!students.length) { $("#monWrap").hidden = true; return; }
  $("#monWrap").hidden = !st.n;
  $("#monWrap").innerHTML = st.n ? monTable(false) : "";
  const warn = monData.flagErr ? `<div class="err">${t("flagRules")}</div>` : "";
  $("#monFlags").innerHTML = warn + (st.n
    ? `<div style="margin-top:12px"><strong>${t("flagsH")}</strong></div>` + (fl.length ? fl.map(f => `<div class="flagTxt" style="font-size:13px;margin:4px 0">🚩 ${esc(f.date)} · ${esc(f.name)} (${esc(f.roll)}) – ${esc(flagText(f))}</div>`).join("") : `<div class="mute">${t("noFlags")}</div>`)
    : `<div class="mute" style="margin-top:10px">${t("monNoData")}</div>`);
}
$("#monWrap").addEventListener("click", e => {
  const c = e.target.closest("td[data-fd]"); if (!c) return;
  openFlag(c.dataset.fd, c.dataset.fr, monData.flags.get(c.dataset.fd + "|" + c.dataset.fr));
});
const monthLabel = ym => new Date(ym + "-01T00:00:00").toLocaleDateString("en-IN", { month: "long", year: "numeric" });
$("#monPdf").onclick = async () => {
  if (!classId) return alert(t("pickClass"));
  if (!students.length) return alert(t("addStudentsFirst"));
  if (!monData || monData.ym !== $("#monMonth").value) await $("#monBtn").onclick();
  if (!monData) return;
  const st = monStats(), fl = monFlagList();
  if (!st.n) return alert(t("monNoData"));
  printDoc(printHead("Monthly Attendance Report", `${clsName()}  |  ${monthLabel(monData.ym)}`) +
    `<div class="sum">Class days: ${st.n} &nbsp;|&nbsp; Students: ${students.length} &nbsp;|&nbsp; Average attendance: ${st.avg}% &nbsp;|&nbsp; Flags: ${fl.length}</div>` +
    monTable(true) +
    `<div class="sum" style="font-weight:400;font-size:11px">P = Present, A = Absent, <sup>F</sup> = flagged that day. Red % = below 75%. Columns are the days on which attendance was taken.</div>` +
    (fl.length ? `<h4>Flags</h4>` + fl.map(f => `<div class="fl">${esc(f.date)} &ndash; ${esc(f.name)} (Roll ${esc(f.roll)}): ${esc(flagText(f))}</div>`).join("") : "") +
    printFoot(), true);
};
$("#monCsv").onclick = async () => {
  if (!classId) return alert(t("pickClass"));
  if (!monData || monData.ym !== $("#monMonth").value) await $("#monBtn").onclick();
  if (!monData || !monData.days.length) return alert(t("monNoData"));
  const st = monStats(), q = v => `"${String(v).replace(/"/g, '""')}"`;
  const head = ["Roll", "Name", ...monData.days.map(x => x.slice(8)), "Present", "Class days", "Percent", "Flags"];
  const rows = students.map((s, i) => [s.roll, s.name, ...monData.days.map(x => (monData.present.get(x).has(s.roll) ? "P" : "A") + (monData.flags.has(x + "|" + s.roll) ? "*" : "")), st.per[i], st.n, st.pct[i] + "%", monData.days.filter(x => monData.flags.has(x + "|" + s.roll)).length]);
  const csv = [head, ...rows].map(r => r.map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `monthly_${classId}_${monData.ym}.csv`;
  a.click();
};

applyLang();
</script>
</body>
</html>
